<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to my website - Task 3</title>
    <style>
        :root {
            --primary-color: #1a5242;
            --secondary-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background-color: var(--primary-color);
            color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--white);
            border: 1px solid #e1e8e5;
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
            display: inline-block;
        }

        button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1rem;
            transition: background-color 0.3s, opacity 0.3s;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }
        
        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Quiz Specifics */
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .quiz-options button {
            background-color: var(--white);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            text-align: left;
            margin-top: 0;
        }

        .quiz-options button:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: var(--white);
        }

        #quiz-result {
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 15px;
        }

        #next-btn {
            display: none;
        }

        /* API Specifics */
        .api-content {
            background-color: #f9f9f9;
            padding: 15px;
            border-left: 4px solid var(--primary-color);
            margin-top: 15px;
            font-style: italic;
            border-radius: 0 4px 4px 0;
            min-height: 100px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.5rem;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to my website</h1>
        <p>Task 3: Advanced Styling and JavaScript (10 Questions)</p>
    </header>

    <div class="main-container">
        
        <!-- 2. Interactive Quiz Section -->
        <div class="card" id="quiz-section">
            <h2>Interactive Web Dev Quiz</h2>
            <div id="quiz-container">
                <p id="question-text"><strong>Question:</strong> Loading...</p>
                <div class="quiz-options" id="options-container">
                    <!-- Options dynamically loaded here -->
                </div>
                <div id="quiz-result"></div>
            </div>
            
            <div class="quiz-footer">
                <span id="score-tracker">Score: 0 / 10</span>
                <button id="next-btn" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>

        <!-- 3. API Fetch Section -->
        <div class="card" id="api-section">
            <h2>API Data Fetch</h2>
            <p>Click the button below to fetch a random piece of advice dynamically from a public API.</p>
            
            <div class="api-content" id="api-data">
                Waiting to fetch data...
            </div>
            
            <button onclick="fetchData()" id="fetch-btn">Fetch Advice</button>
        </div>

    </div>

    <script>
        // --- 2. Interactive Quiz Logic (10 Questions) ---
        const quizData = [
            {
                question: "Which CSS property is used to control the layout of flex items in a flex container?",
                options: ["A) grid-template", "B) justify-content", "C) display-align", "D) float"],
                correct: 1 // index of correct option
            },
            {
                question: "What does HTML stand for?",
                options: ["A) Hyper Text Markup Language", "B) High Text Machine Language", "C) Hyperloop Text Markup Language", "D) Hyper Text Multiple Language"],
                correct: 0
            },
            {
                question: "Which method is used to parse a JSON string into a JavaScript object?",
                options: ["A) JSON.stringify()", "B) JSON.object()", "C) JSON.parse()", "D) JSON.convert()"],
                correct: 2
            },
            {
                question: "In CSS, which unit is relative to the font-size of the root element?",
                options: ["A) em", "B) rem", "C) px", "D) vh"],
                correct: 1
            },
            {
                question: "How do you declare a JavaScript variable that cannot be reassigned?",
                options: ["A) const", "B) var", "C) let", "D) static"],
                correct: 0
            },
            {
                question: "Which HTML meta tag is used to make a web page responsive?",
                options: ["A) meta name='responsive'", "B) meta name='viewport'", "C) meta charset='UTF-8'", "D) meta name='screen'"],
                correct: 1
            },
            {
                question: "What is the default display value of a <div> element?",
                options: ["A) inline", "B) block", "C) inline-block", "D) flex"],
                correct: 1
            },
            {
                question: "Which JavaScript method adds a new element to the end of an array?",
                options: ["A) pop()", "B) shift()", "C) push()", "D) unshift()"],
                correct: 2
            },
            {
                question: "In CSS Grid, which property defines the columns of the grid?",
                options: ["A) grid-template-columns", "B) grid-columns", "C) grid-template-rows", "D) grid-auto-columns"],
                correct: 0
            },
            {
                question: "Which HTML5 tag is used for playing video files?",
                options: ["A) <media>", "B) <movie>", "C) <video>", "D) <audio>"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const resultDiv = document.getElementById('quiz-result');
        const nextBtn = document.getElementById('next-btn');
        const scoreTracker = document.getElementById('score-tracker');
        const quizContainer = document.getElementById('quiz-container');

        function loadQuestion() {
            // Reset state
            resultDiv.style.display = 'none';
            nextBtn.style.display = 'none';
            optionsContainer.innerHTML = '';
            
            const currentQuestion = quizData[currentQuestionIndex];
            questionText.innerHTML = `<strong>Question ${currentQuestionIndex + 1}:</strong> ${currentQuestion.question}`;

            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.onclick = () => submitAnswer(btn, index === currentQuestion.correct);
                optionsContainer.appendChild(btn);
            });
            
            scoreTracker.innerText = `Score: ${score} / 10`;
        }

        function submitAnswer(btn, isCorrect) {
            const allButtons = document.querySelectorAll('.quiz-options button');
            allButtons.forEach(button => button.disabled = true);
            
            resultDiv.style.display = 'block';
            if (isCorrect) {
                resultDiv.innerHTML = "✅ Correct!";
                resultDiv.style.backgroundColor = "#e8f5e9";
                resultDiv.style.color = "#2e7d32";
                btn.style.backgroundColor = "#4caf50";
                btn.style.color = "white";
                score++;
            } else {
                const correctOptionText = quizData[currentQuestionIndex].options[quizData[currentQuestionIndex].correct];
                resultDiv.innerHTML = `❌ Incorrect. The right answer was: ${correctOptionText}`;
                resultDiv.style.backgroundColor = "#ffebee";
                resultDiv.style.color = "#c62828";
                btn.style.backgroundColor = "#ef5350";
                btn.style.color = "white";
            }
            
            scoreTracker.innerText = `Score: ${score} / 10`;
            
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.style.display = 'block';
                nextBtn.innerText = 'Next Question';
            } else {
                nextBtn.style.display = 'block';
                nextBtn.innerText = 'Restart Quiz';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                // Restart Quiz
                currentQuestionIndex = 0;
                score = 0;
                loadQuestion();
            }
        }

        // --- 3. Fetch Data from an API Logic ---
        async function fetchData() {
            const displayElement = document.getElementById('api-data');
            const fetchBtn = document.getElementById('fetch-btn');
            
            displayElement.innerHTML = "<em>Loading data from API...</em>";
            fetchBtn.disabled = true;
            fetchBtn.innerText = "Fetching...";
            
            try {
                const response = await fetch('https://api.adviceslip.com/advice', { cache: "no-store" });
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                displayElement.innerHTML = `<strong>Advice #${data.slip.id}:</strong><br><br>"${data.slip.advice}"`;
            } catch (error) {
                displayElement.innerHTML = `<span style="color: #c62828;">Failed to fetch data. Please check your network connection.</span>`;
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.innerText = "Fetch Another Advice";
            }
        }

        // Initialize on load
        window.onload = () => {
            loadQuestion();
            fetchData();
        };
    </script>
</body>
</html>
